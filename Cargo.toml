[package]
name = "hermes-gem-cli-rs"
version = "0.1.0"
edition = "2021"
description = "Gemini Gem CLI via WebAPI in Rust — Rust port of lesterppo/hermes-gem-cli"
license = "MIT"

[[bin]]
name = "gem-cli-rs"
path = "src/main.rs"

[lib]
name = "gem_cli_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leyline-http = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

[dev-dependencies]
